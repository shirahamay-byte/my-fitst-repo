<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050812">
<title>星晶のクロニクル</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:none;-webkit-user-select:none;user-select:none}
html,body{position:fixed;inset:0;margin:0;width:100%;height:100%;overflow:hidden;background:#050812;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{height:100dvh;display:grid;place-items:center}
#box{text-align:center;padding:28px;max-width:520px}
#title{font-size:30px;font-weight:900;letter-spacing:.08em;margin-bottom:12px;color:#b9dcff}
#status{font-size:16px;line-height:1.8;color:#fff}
#bar{width:min(72vw,360px);height:10px;margin:18px auto;border:1px solid #7eb5ff;border-radius:99px;overflow:hidden;background:#10182c}
#fill{height:100%;width:8%;background:linear-gradient(90deg,#4e8cff,#8ee9ff);transition:width .2s}
#retry{display:none;border:1px solid #9bc9ff;border-radius:999px;padding:12px 24px;background:#14264e;color:#fff;font:inherit;font-weight:900}
</style>
<script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
</head>
<body>
<div id="box"><div id="title">星晶のクロニクル</div><div id="status">冒険世界を読み込んでいます</div><div id="bar"><div id="fill"></div></div><button id="retry">再読み込み</button></div>
<script>
(()=>{
'use strict';
const status=document.getElementById('status'),fill=document.getElementById('fill'),retry=document.getElementById('retry');
const source='https://raw.githack.com/shirahamay-byte/my-fitst-repo/main/star-crystal-chronicle/index.html';
function fail(message){status.innerHTML=message;fill.style.width='0%';retry.style.display='inline-block'}
async function boot(){
  retry.style.display='none';status.textContent='冒険世界を読み込んでいます';fill.style.width='12%';
  try{
    if(!window.pako)throw new Error('展開ライブラリを読み込めませんでした');
    const res=await fetch(source+'?v='+Date.now(),{cache:'no-store'});
    if(!res.ok)throw new Error('ゲームデータが見つかりません: '+res.status);
    fill.style.width='38%';
    const loader=await res.text();
    const match=loader.match(/const b="([A-Za-z0-9+/=]+)"/);
    if(!match)throw new Error('ゲームデータの形式を確認できませんでした');
    fill.style.width='62%';
    const raw=atob(match[1]);
    const bytes=new Uint8Array(raw.length);
    for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);
    const html=window.pako.ungzip(bytes,{to:'string'});
    if(!html.includes('<title>星晶のクロニクル</title>'))throw new Error('展開したデータが不正です');
    fill.style.width='100%';status.textContent='起動します';
    setTimeout(()=>{document.open();document.write(html);document.close()},120);
  }catch(err){
    console.error(err);
    fail('読み込みに失敗しました<br><small>'+String(err.message||err)+'</small>');
  }
}
retry.addEventListener('click',boot);
['touchmove','gesturestart','gesturechange','gestureend','dblclick','contextmenu'].forEach(n=>document.addEventListener(n,e=>e.preventDefault(),{passive:false}));
boot();
})();
</script>
</body>
</html>
