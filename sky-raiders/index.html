<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Sky Raiders</title><style>*{box-sizing:border-box}html,body{margin:0;overflow:hidden;background:#07151d;touch-action:none;font-family:-apple-system,sans-serif}canvas{display:block;width:100vw;height:100dvh}#h{position:fixed;top:max(10px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;color:#fff;font-weight:800;text-shadow:0 2px 3px #000;pointer-events:none}.b{position:fixed;bottom:max(20px,env(safe-area-inset-bottom));width:82px;height:82px;border-radius:50%;border:2px solid #ffffff88;background:#07151dbb;color:#fff;font-weight:900;font-size:15px}#f{right:18px}#m{right:110px;width:64px;height:64px;bottom:calc(max(20px,env(safe-area-inset-bottom)) + 9px)}#over{display:none;position:fixed;inset:0;place-items:center;background:#07151ddd;color:#fff;text-align:center;font-size:28px;font-weight:900}#over small{font-size:17px;font-weight:600}</style></head><body><canvas id="c"></canvas><div id="h"><span id="s">SCORE 000000</span><span id="l">LIFE 3</span></div><button class="b" id="m">BOMB</button><button class="b" id="f">SHOT</button><div id="over"></div><script>(()=>{const c=document.querySelector('#c'),q=c.getContext('2d'),S=document.querySelector('#s'),L=document.querySelector('#l'),F=document.querySelector('#f'),M=document.querySelector('#m'),O=document.querySelector('#over');let W,H,d=1,last=0,t=0,score=0,life=3,drag=0,sp=0,gp=0,B=[],E=[],G=[],X=[],P=[],A=[];const p={x:0,y:0,r:14,fc:0,bc:0,iv:2};const rnd=(a,b)=>a+Math.random()*(b-a),cl=(v,a,b)=>Math.max(a,Math.min(b,v)),hit=(a,b)=>{let x=a.x-b.x,y=a.y-b.y;return x*x+y*y<(a.r+b.r)**2};function size(){d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;q.setTransform(d,0,0,d,0,0);p.x||reset()}function hud(){S.textContent='SCORE '+String(score).padStart(6,'0');L.textContent='LIFE '+life}function reset(){score=0;life=3;t=0;B=[];E=[];G=[];X=[];P=[];A=[];p.x=W/2;p.y=H-130;p.iv=2;O.style.display='none';hud()}function boom(x,y,n=16){for(let i=0;i<n;i++)P.push({x,y,vx:rnd(-170,170),vy:rnd(-170,170),z:rnd(.25,.7),r:rnd(2,5)})}function fire(){if(p.fc>0)return;p.fc=.11;B.push({x:p.x-8,y:p.y-18,r:3},{x:p.x+8,y:p.y-18,r:3})}function bomb(){if(p.bc>0)return;p.bc=.55;A.push({x:p.x,y:p.y-5,r:5,z:0})}function hurt(){if(p.iv>0)return;boom(p.x,p.y,28);life--;hud();p.iv=2;p.x=W/2;p.y=H-130;if(life<1){O.innerHTML='GAME OVER<br><small>SCORE '+score+'<br>画面をタップして再開</small>';O.style.display='grid'}}function pos(e){let z=e.touches?e.touches[0]:e;return{x:z.clientX,y:z.clientY}}function move(e){if(!drag)return;let z=pos(e);p.x=cl(z.x,20,W-20);p.y=cl(z.y,55,H-45)}c.onpointerdown=e=>{drag=1;move(e)};c.onpointermove=move;onpointerup=()=>drag=0;c.addEventListener('touchstart',e=>{e.preventDefault();drag=1;move(e)},{passive:false});c.addEventListener('touchmove',e=>{e.preventDefault();move(e)},{passive:false});c.addEventListener('touchend',()=>drag=0);O.onclick=reset;let hold=0;function fd(e){e.preventDefault();fire();clearInterval(hold);hold=setInterval(fire,90)}function fu(e){e.preventDefault();clearInterval(hold)}F.onpointerdown=fd;F.onpointerup=fu;F.onpointercancel=fu;M.onpointerdown=e=>{e.preventDefault();bomb()};function update(dt){if(O.style.display==='grid')return;t+=dt;p.fc-=dt;p.bc-=dt;p.iv-=dt;sp-=dt;gp-=dt;if(sp<0){E.push({x:rnd(30,W-30),y:-25,r:15,v:rnd(105,165),a:rnd(0,6.3),hp:Math.random()<.78?1:2,f:rnd(.7,1.8)});sp=Math.max(.3,.75-t*.002)}if(gp<0){G.push({x:rnd(40,W-40),y:-25,r:17,hp:1,k:Math.random()<.7?0:1,f:rnd(1,2.4)});gp=rnd(1,1.8)}B.forEach(b=>b.y-=570*dt);A.forEach(a=>{a.y-=210*dt;a.z+=dt;a.r=5+a.z*8;if(a.z>.55){G.forEach(g=>{if(Math.hypot(g.x-a.x,g.y-a.y)<62)g.hp=0});boom(a.x,a.y,22);a.d=1}});E.forEach(e=>{e.y+=e.v*dt;e.a+=dt*3;e.x+=Math.sin(e.a)*55*dt;e.f-=dt;if(e.f<0&&e.y>40&&e.y<H*.68){let x=p.x-e.x,y=p.y-e.y,m=Math.hypot(x,y)||1;X.push({x:e.x,y:e.y,r:5,vx:x/m*150,vy:y/m*150});e.f=rnd(1.1,2.1)}});G.forEach(g=>{g.y+=92*dt;g.f-=dt;if(!g.k&&g.f<0&&g.y>40&&g.y<H*.7){let x=p.x-g.x,y=p.y-g.y,m=Math.hypot(x,y)||1;X.push({x:g.x,y:g.y,r:5,vx:x/m*125,vy:y/m*125});g.f=rnd(1.5,2.7)}});X.forEach(b=>{b.x+=b.vx*dt;b.y+=b.vy*dt});P.forEach(a=>{a.x+=a.vx*dt;a.y+=a.vy*dt;a.vx*=.97;a.vy*=.97;a.z-=dt});B.forEach(b=>E.forEach(e=>{if(!b.d&&!e.d&&hit(b,e)){b.d=1;if(--e.hp<1){e.d=1;boom(e.x,e.y);score+=100}}}));E.forEach(e=>{if(!e.d&&hit(p,e)){e.d=1;hurt()}});X.forEach(b=>{if(!b.d&&hit(p,b)){b.d=1;hurt()}});G.forEach(g=>{if(g.hp<1){g.d=1;boom(g.x,g.y);score+=g.k?250:150}});B=B.filter(a=>!a.d&&a.y>-30);A=A.filter(a=>!a.d);E=E.filter(a=>!a.d&&a.y<H+40);G=G.filter(a=>!a.d&&a.y<H+40);X=X.filter(a=>!a.d&&a.y<H+30&&a.x>-30&&a.x<W+30);P=P.filter(a=>a.z>0);hud()}function draw(){q.fillStyle='#1b5b52';q.fillRect(0,0,W,H);q.strokeStyle='#cfe8a733';q.lineWidth=2;for(let y=t*90%60-60;y<H;y+=60){q.beginPath();q.moveTo(0,y);q.lineTo(W,y);q.stroke()}let r=W/2+Math.sin(t*.35)*70;q.fillStyle='#19445f';q.beginPath();q.moveTo(r-55,0);for(let y=0;y<=H;y+=30)q.lineTo(r-55+Math.sin(y*.012+t)*35,y);for(let y=H;y>=0;y-=30)q.lineTo(r+55+Math.sin(y*.012+t)*35,y);q.fill();G.forEach(g=>{q.fillStyle=g.k?'#d49cff':'#aab8c2';q.beginPath();q.arc(g.x,g.y,17,0,7);q.fill();if(!g.k){q.fillStyle='#384b58';q.fillRect(g.x-4,g.y-24,8,24)}});A.forEach(a=>{q.fillStyle='#fff3a1';q.beginPath();q.arc(a.x,a.y,a.r,0,7);q.fill()});E.forEach(e=>{q.save();q.translate(e.x,e.y);q.fillStyle=e.hp>1?'#ffcf57':'#f25f5c';q.beginPath();q.moveTo(0,20);q.lineTo(17,-12);q.lineTo(4,-8);q.lineTo(0,-20);q.lineTo(-4,-8);q.lineTo(-17,-12);q.closePath();q.fill();q.restore()});q.fillStyle='#b9f7ff';B.forEach(b=>q.fillRect(b.x-2,b.y-8,4,16));q.fillStyle='#ff764d';X.forEach(b=>{q.beginPath();q.arc(b.x,b.y,5,0,7);q.fill()});P.forEach(a=>{q.globalAlpha=Math.max(0,a.z/.7);q.fillStyle='#ffd166';q.fillRect(a.x,a.y,a.r,a.r)});q.globalAlpha=1;if(!(p.iv>0&&Math.floor(p.iv*12)%2===0)){q.save();q.translate(p.x,p.y);q.fillStyle='#e7f4ff';q.beginPath();q.moveTo(0,-22);q.lineTo(14,17);q.lineTo(0,10);q.lineTo(-14,17);q.closePath();q.fill();q.fillStyle='#4fd6ff';q.fillRect(-3,-13,6,17);q.fillStyle='#ffb347';q.beginPath();q.moveTo(-5,15);q.lineTo(0,27+Math.sin(t*35)*4);q.lineTo(5,15);q.fill();q.restore()}}function loop(n){let dt=Math.min(.033,(n-last)/1000||0);last=n;update(dt);draw();requestAnimationFrame(loop)}addEventListener('resize',size);size();reset();requestAnimationFrame(loop)})();</script></body></html>
