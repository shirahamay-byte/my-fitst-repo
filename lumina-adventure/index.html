<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#10172b">
<title>ルミナの星空大冒険・iPhone修正版</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:none!important;-webkit-user-select:none;user-select:none}
html,body{position:fixed;inset:0;margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:#10172b;-webkit-text-size-adjust:100%}
body{height:100dvh}
#gameFrame{position:fixed;inset:0;width:100%;height:100dvh;border:0;display:block;background:#10172b}
#pad{position:fixed;inset:0;z-index:20;pointer-events:none;display:none}
.ctrl{position:absolute;display:grid;place-items:center;border:2px solid #ffffff8a;background:#10203dd8;color:#fff;font-family:-apple-system,sans-serif;font-weight:900;box-shadow:inset 0 0 18px #ffffff20,0 4px 18px #0008;backdrop-filter:blur(6px);pointer-events:auto}
.ctrl.active{transform:scale(.92);background:#314f82e8}
#left,#right{bottom:max(22px,env(safe-area-inset-bottom));width:82px;height:82px;border-radius:24px;font-size:32px}
#left{left:16px}#right{left:108px}
#jump{right:16px;bottom:max(22px,env(safe-area-inset-bottom));width:104px;height:104px;border-radius:50%;font-size:17px;background:#b22e62df}
#pause{right:12px;top:max(42px,calc(env(safe-area-inset-top) + 34px));width:46px;height:46px;border-radius:50%;font-size:18px}
#loading{position:fixed;inset:0;z-index:30;display:grid;place-items:center;color:#fff;background:#10172b;font:800 18px -apple-system,sans-serif}
</style>
</head>
<body>
<iframe id="gameFrame" allow="autoplay" src="https://raw.githack.com/shirahamay-byte/my-fitst-repo/796d2cdca14906c0eabce0962aff26c74a0d86e4/lumina-adventure/index.html"></iframe>
<div id="pad">
  <div id="left" class="ctrl">◀</div>
  <div id="right" class="ctrl">▶</div>
  <div id="jump" class="ctrl">JUMP</div>
  <div id="pause" class="ctrl">Ⅱ</div>
</div>
<div id="loading">ゲームを読み込んでいます</div>
<script>
(()=>{
'use strict';
const frame=document.getElementById('gameFrame'),pad=document.getElementById('pad'),loading=document.getElementById('loading');
const active=new Map();
let childDoc=null,childWin=null;
const prevent=e=>e.preventDefault();
['touchmove','gesturestart','gesturechange','gestureend','dblclick','contextmenu','dragstart','selectstart'].forEach(n=>document.addEventListener(n,prevent,{passive:false}));
function childButton(name){return childDoc&&childDoc.getElementById(name)}
function send(name,type,id){
  const el=childButton(name);if(!el||!childWin)return;
  try{
    el.dispatchEvent(new childWin.PointerEvent(type,{bubbles:true,cancelable:true,pointerId:id,pointerType:'touch',isPrimary:false,clientX:0,clientY:0}));
  }catch(_){
    const ev=childDoc.createEvent('Event');ev.initEvent(type,true,true);Object.defineProperty(ev,'pointerId',{value:id});el.dispatchEvent(ev);
  }
}
function bind(el,name){
  el.addEventListener('pointerdown',e=>{
    e.preventDefault();e.stopPropagation();active.set(e.pointerId,{name,el});el.classList.add('active');
    try{el.setPointerCapture(e.pointerId)}catch(_){ }
    send(name,'pointerdown',e.pointerId);
  },{passive:false});
}
function release(e){
  const a=active.get(e.pointerId);if(!a)return;
  e.preventDefault();send(a.name,'pointerup',e.pointerId);a.el.classList.remove('active');active.delete(e.pointerId);
}
bind(document.getElementById('left'),'left');bind(document.getElementById('right'),'right');bind(document.getElementById('jump'),'jump');
bind(document.getElementById('pause'),'pause');
window.addEventListener('pointerup',release,{passive:false});
window.addEventListener('pointercancel',release,{passive:false});
function releaseAll(){
  for(const [id,a] of active){send(a.name,'pointerup',id);a.el.classList.remove('active')}
  active.clear();
}
window.addEventListener('blur',releaseAll);window.addEventListener('pagehide',releaseAll);
frame.addEventListener('load',()=>{
  try{
    childWin=frame.contentWindow;childDoc=frame.contentDocument;
    const style=childDoc.createElement('style');
    style.textContent='html,body,*{touch-action:none!important;-webkit-user-select:none!important;user-select:none!important}html,body{position:fixed!important;inset:0!important;overflow:hidden!important;overscroll-behavior:none!important}#controls{display:none!important}';
    childDoc.head.appendChild(style);
    ['touchmove','gesturestart','gesturechange','gestureend','dblclick','contextmenu'].forEach(n=>childDoc.addEventListener(n,prevent,{passive:false}));
    const ov=childDoc.getElementById('overlay');
    const sync=()=>{pad.style.display=ov&&ov.classList.contains('hidden')?'block':'none';if(pad.style.display==='none')releaseAll()};
    if(ov)new MutationObserver(sync).observe(ov,{attributes:true,attributeFilter:['class'],childList:true,subtree:false});
    sync();loading.style.display='none';
  }catch(err){loading.textContent='Safariで開き直してください'}
});
})();
</script>
</body>
</html>
