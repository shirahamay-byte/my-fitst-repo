r.health));stageEl.textContent="STAGE "+(stageIndex+1)+"  "+(level?level.name:"")}function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);canvas.style.width=W+"px";canvas.style.height=H+"px";ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener("resize",resize);resize();function solids(e,dt){e.x+=e.vx*dt;for(const r of level.platforms)if(rectHit(e,r)){if(e.vx>0)e.x=r.x-e.w;else if(e.vx<0)e.x=r.x+r.w;e.vx=0}e.y+=e.vy*dt;e.onGround=false;for(const r of level.platforms)if(rectHit(e,r)){if(e.vy>0){e.y=r.y-e.h;e.vy=0;e.onGround=true}else if(e.vy<0){e.y=r.y+r.h;e.vy=0}}}function hurt(){if(player.inv>0||state!=="playing"||respawning)return;player.health--;player.inv=2;player.vy=-340;player.vx=-player.facing*180;shake=12;flash=.22;audio.hurt();addParticle(player.x+15,player.y+20,"#ff5470",18,220);hud();if(player.health<=0){respawning=true;setTimeout(respawn,420)}}function respawn(){player.health=3;player.inv=1.4;player.x=player.checkpointX;player.y=player.checkpointY;player.vx=player.vy=0;cameraX=clamp(player.x-W*.35,0,Math.max(0,level.width-W));respawning=false;hud()}function kill(e){if(!e.alive)return;e.alive=false;score+=e.type==="boss"?2500:200;audio.stomp();addParticle(e.x+e.w/2,e.y+e.h/2,e.type==="boss"?"#d95cff":"#ffd14d",18,e.type==="boss"?260:180);popup(e.x,e.y,"+"+(e.type==="boss"?2500:200),"#fff17c");shake=e.type==="boss"?16:5;hud()}function update(dt){if(paused||state!=="playing")return;player.inv-=dt;player.anim+=dt;flash=Math.max(0,flash-dt);shake=Math.max(0,shake-35*dt);if(input.jumpPressed)player.jumpBuffer=.13;input.jumpPressed=false;player.jumpBuffer-=dt;player.coyote=player.onGround?.11:player.coyote-dt;const accel=player.onGround?1700:950,max=230,fr=player.onGround?1500:250,dir=(input.right?1:0)-(input.left?1:0);if(dir){player.vx+=dir*accel*dt;player.facing=dir}else{if(player.vx>0)player.vx=Math.max(0,player.vx-fr*dt);if(player.vx<0)player.vx=Math.min(0,player.vx+fr*dt)}player.vx=clamp(player.vx,-max,max);if(player.jumpBuffer>0&&player.coyote>0){player.vy=-470;player.onGround=false;player.coyote=0;player.jumpBuffer=0;audio.jump();addParticle(player.x+15,player.y+40,"#dff6ff",7,80)}if(!input.jump&&player.vy<-180)player.vy+=1000*dt;player.vy=Math.min(850,player.vy+1250*dt);const oldBottom=player.y+player.h;solids(player,dt);player.x=clamp(player.x,0,level.width-player.w);for(const c of level.coins){if(!c.collected&&rectHit(player,c)){c.collected=true;stars++;score+=100;audio.coin();addParticle(c.x+9,c.y+9,"#fff16b",10,130);popup(c.x,c.y,"+100","#fff16b");hud()}c.spin+=dt*6}for(const s of level.spikes)if(rectHit(player,s))hurt();for(const cp of level.checkpoints)if(!cp.active&&rectHit(player,cp)){cp.active=true;player.checkpointX=cp.x+30;player.checkpointY=cp.y-10;score+=500;audio.checkpoint();addParticle(cp.x+10,cp.y,"#59f5ff",20,170);popup(cp.x,cp.y-15,"CHECKPOINT","#59f5ff");hud()}for(const e of level.enemies){if(!e.alive)continue;e.t+=dt;e.hitCd-=dt;if(e.type==="flyer"){e.x+=Math.sin(e.t*1.8)*45*dt;e.y+=Math.sin(e.t*3)*34*dt}else{e.vy=Math.min(750,e.vy+1100*dt);if(e.type==="hopper"&&e.onGround&&Math.sin(e.t*2.2)>.92)e.vy=-390;if(Math.abs(e.vx)<10)e.vx=(player.x<e.x?-1:1)*55;const v=e.vx;solids(e,dt);if(v!==0&&e.vx===0)e.vx=-v}if(rectHit(player,e)){const stomp=player.vy>90&&oldBottom<=e.y+12;if(stomp){player.y=e.y-player.h;player.vy=-350;kill(e)}else hurt()}}if(level.boss&&level.boss.alive){const e=level.boss;e.t+=dt;e.hitCd-=dt;e.vy=Math.min(850,e.vy+1200*dt);if(e.onGround&&Math.sin(e.t*1.4)>.8)e.vy=-520;if(Math.abs(e.vx)<20)e.vx=(player.x<e.x?-1:1)*110;const v=e.vx;solids(e,dt);if(v!==0&&e.vx===0)e.vx=-v;if(rectHit(player,e)){const stomp=player.vy>100&&oldBottom<=e.y+16;if(stomp&&e.hitCd<=0){player.y=e.y-player.h;player.vy=-420;e.hp--;e.hitCd=.75;audio.bossHit();shake=14;popup(e.x,e.y-20,"BOSS "+e.hp,"#ff9de1");if(e.hp<=0)kill(e)}else hurt()}}if((!level.boss||!level.boss.alive)&&rectHit(player,level.goal))finish();if(player.y>level.height+180&&!respawning){player.health=0;audio.hurt();respawning=true;setTimeout(respawn,300)}cameraX=lerp(cameraX,clamp(player.x-W*.38,0,Math.max(0,level.width-W)),1-Math.pow(.001,dt));particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=420*dt;p.life-=dt});particles=particles.filter(p=>p.life>0);popups.forEach(p=>{p.y-=35*dt;p.life-=dt});popups=popups.filter(p=>p.life>0)}function finish(){if(state!=="playing")return;state="transition";score+=1000;audio.finish();hud();addParticle(level.goal.x+15,level.goal.y,"#fff16b",42,260);setTimeout(()=>{if(stageIndex<2)message("STAGE CLEAR","次のステージへ",()=>loadStage(stageIndex+1));else message("ALL CLEAR!","ルミナは星空を取り戻しました。<br>最終スコア "+score+"　星 "+stars,()=>{stageIndex=0;score=0;stars=0;loadStage(0)})},900)}function message(title,body,next){state="menu";overlay.innerHTML=`<div class="panel"><h1>${title}</h1><p>${body}</p><button id="nextBtn" class="start">CONTINUE</button></div>`;overlay.classList.remove("hidden");document.getElementById("nextBtn").onpointerdown=e=>{e.preventDefault();overlay.classList.add("hidden");next()}}function cloud(x,y,s=1){ctx.fillStyle="#ffffffbb";ctx.beginPath();ctx.arc(x,y,24*s,0,7);ctx.arc(x+28*s,y-10*s,30*s,0,7);ctx.arc(x+62*s,y,23*s,0,7);ctx.fillRect(x,y,62*s,24*s);ctx.fill()}function bg(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,level.sky[0]);g.addColorStop(1,level.sky[1]);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);if(stageIndex===0){for(let i=0;i<7;i++)cloud((i*260-cameraX*.18)%(W+400)-120,80+i%3*70,.7+i%2*.25);ctx.fillStyle="#7cc477";for(let i=0;i<9;i++){let x=i*260-cameraX*.35;ctx.beginPath();ctx.moveTo(x,H);ctx.lineTo(x+120,H-210-i%3*35);ctx.lineTo(x+260,H);ctx.fill()}}else if(stageIndex===1){ctx.fillStyle="#f6f1d0";ctx.beginPath();ctx.arc(W-90,100,48,0,7);ctx.fill();ctx.fillStyle="#ffffff77";for(let i=0;i<80;i++){let x=(i*83-cameraX*.08)%(W+20),y=i*47%260;ctx.fillRect(x,y,2,2)}ctx.fillStyle="#17183e";for(let i=0;i<8;i++){let x=i*310-cameraX*.25;ctx.fillRect(x,H-250,180,250);ctx.beginPath();ctx.moveTo(x-20,H-250);ctx.lineTo(x+90,H-360);ctx.lineTo(x+200,H-250);ctx.fill()}}else{ctx.fillStyle="#ffffffaa";for(let i=0;i<100;i++){let x=(i*97-cameraX*.12)%(W+20),y=i*61%H;ctx.fillRect(x,y,i%3+1,i%3+1)}ctx.strokeStyle="#8c5cff55";ctx.lineWidth=34;ctx.beginPath();ctx.arc(W*.55,H*.4,250,0,5.3);ctx.stroke()}}function drawPlatform(r){let x=r.x-cameraX;if(x+r.w<0||x>W)return;if(r.type==="grass"){ctx.fillStyle="#7d4f2a";ctx.fillRect(x,r.y,r.w,r.h);ctx.fillStyle="#58b957";ctx.fillRect(x,r.y,r.w,15);ctx.fillStyle="#9ee36d";for(let i=0;i<r.w;i+=28)ctx.fillRect(x+i,r.y,15,5)}else if(r.type==="stone"){ctx.fillStyle="#4d4966";ctx.fillRect(x,r.y,r.w,r.h);ctx.strokeStyle="#77708f";ctx.lineWidth=2;for(let yy=r.y;yy<r.y+r.h;yy+=24)for(let xx=x;xx<x+r.w;xx+=42)ctx.strokeRect(xx+(yy/24%2)*18,yy,42,24);ctx.fillStyle="#9188aa";ctx.fillRect(x,r.y,r.w,8)}else{ctx.fillStyle="#323d54";ctx.fillRect(x,r.y,r.w,r.h);ctx.fillStyle="#59687e";ctx.fillRect(x,r.y,r.w,10);ctx.fillStyle="#9af7ff";for(let i=8;i<r.w;i+=48)ctx.fillRect(x+i,r.y+18,22,4)}}function drawCoin(c){if(c.collected)return;let x=c.x-cameraX;if(x<-25||x>W+25)return;ctx.save();ctx.translate(x+9,c.y+9);ctx.scale(.35+Math.abs(Math.cos(c.spin))*.65,1);ctx.fillStyle="#fff064";ctx.beginPath();for(let i=0;i<10;i++){let a=-Math.PI/2+i*Math.PI/5,r=i%2?7:14;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();ctx.fill();ctx.strokeStyle="#cc8e20";ctx.lineWidth=2;ctx.stroke();ctx.restore()}function drawSpike(s){const x=s.x-cameraX;if(x+s.w<0||x>W)return;ctx.fillStyle=stageIndex===0?"#d7e6ef":"#d99bff";for(let i=0;i<s.w;i+=18){ctx.beginPath();ctx.moveTo(x+i,s.y+s.h);ctx.lineTo(x+i+9,s.y);ctx.lineTo(x+i+18,s.y+s.h);ctx.fill()}}function drawEnemy(e){if(!e.alive)return;const x=e.x-cameraX;if(x+e.w<-20||x>W+20)return;ctx.save();ctx.translate(x+e.w/2,e.y+e.h/2);if(e.hitCd>0&&Math.floor(e.hitCd*14)%2===0)ctx.globalAlpha=.35;if(e.type==="flyer"){ctx.fillStyle="#8fe9ff";ctx.beginPath();ctx.ellipse(-18,0,16,8,Math.sin(e.t*14)*.3,0,7);ctx.ellipse(18,0,16,8,-Math.sin(e.t*14)*.3,0,7);ctx.fill();ctx.fillStyle="#6b4bbd";ctx.beginPath();ctx.arc(0,3,15,0,7);ctx.fill()}else{ctx.fillStyle=e.type==="boss"?"#cb4ee8":e.type==="hopper"?"#ff8b59":"#754fd0";ctx.beginPath();ctx.roundRect(-e.w/2,-e.h/2,e.w,e.h,12);ctx.fill();ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(-e.w*.17,-5,e.type==="boss"?9:6,0,7);ctx.arc(e.w*.17,-5,e.type==="boss"?9:6,0,7);ctx.fill();ctx.fillStyle="#1b1738";ctx.beginPath();ctx.arc(-e.w*.17,-4,3,0,7);ctx.arc(e.w*.17,-4,3,0,7);ctx.fill()}ctx.restore()}function drawPlayer(){if(player.inv>0&&Math.floor(player.inv*12)%2===0)return;const x=player.x-cameraX,y=player.y;ctx.save();ctx.translate(x+15,y+20);if(player.facing<0)ctx.scale(-1,1);const run=Math.sin(player.anim*15)*Math.min(1,Math.abs(player.vx)/150);ctx.strokeStyle="#62457b";ctx.lineWidth=5;ctx.lineCap="round";ctx.beginPath();ctx.moveTo(-7,14);ctx.lineTo(-9-run*5,21);ctx.moveTo(7,14);ctx.lineTo(9+run*5,21);ctx.stroke();ctx.fillStyle="#f4f2ff";ctx.beginPath();ctx.ellipse(-8,-17,6,18,-.18,0,7);ctx.ellipse(8,-17,6,18,.18,0,7);ctx.fill();ctx.fillStyle="#f6f4ff";ctx.beginPath();ctx.roundRect(-14,-12,28,31,12);ctx.fill();ctx.fillStyle="#7350a1";ctx.beginPath();ctx.roundRect(-12,1,24,18,8);ctx.fill();ctx.fillStyle="#4b355d";ctx.beginPath();ctx.arc(-5,-4,2.3,0,7);ctx.arc(6,-4,2.3,0,7);ctx.fill();ctx.fillStyle="#ff7ca8";ctx.beginPath();ctx.arc(11,4,3,0,7);ctx.fill();ctx.restore()}function render(){if(!level){ctx.fillStyle="#10172b";ctx.fillRect(0,0,W,H);return}ctx.save();if(shake>0)ctx.translate(rnd(-shake,shake),rnd(-shake,shake));bg();level.platforms.forEach(drawPlatform);level.coins.forEach(drawCoin);level.spikes.forEach(drawSpike);level.checkpoints.forEach(cp=>{const x=cp.x-cameraX;ctx.fillStyle="#d8e5ef";ctx.fillRect(x,cp.y,5,cp.h);ctx.fillStyle=cp.active?"#59f5ff":"#b9c6d4";ctx.beginPath();ctx.moveTo(x+5,cp.y);ctx.lineTo(x+42,cp.y+13);ctx.lineTo(x+5,cp.y+27);ctx.fill()});{const g=level.goal,x=g.x-cameraX;ctx.fillStyle="#f4f0da";ctx.fillRect(x,g.y,6,g.h);ctx.fillStyle="#fff16b";ctx.beginPath();for(let i=0;i<10;i++){let a=-Math.PI/2+i*Math.PI/5,r=i%2?12:23;ctx.lineTo(x+3+Math.cos(a)*r,g.y+Math.sin(a)*r)}ctx.closePath();ctx.fill()}level.enemies.forEach(drawEnemy);if(level.boss)drawEnemy(level.boss);drawPlayer();particles.forEach(p=>{ctx.globalAlpha=clamp(p.life/p.max,0,1);ctx.fillStyle=p.color;ctx.fillRect(p.x-cameraX,p.y,p.size,p.size)});ctx.globalAlpha=1;ctx.textAlign="center";ctx.font="900 16px -apple-system,sans-serif";popups.forEach(p=>{ctx.globalAlpha=p.life;ctx.fillStyle=p.color;ctx.fillText(p.text,p.x-cameraX,p.y)});ctx.globalAlpha=1;ctx.restore();if(level.boss&&level.boss.alive&&player.x>3900){ctx.fillStyle="#0008";ctx.fillRect(W*.18,58,W*.64,14);ctx.fillStyle="#ff4fa3";ctx.fillRect(W*.18+2,60,(W*.64-4)*(level.boss.hp/6),10);ctx.strokeStyle="#fff";ctx.strokeRect(W*.18,58,W*.64,14)}if(flash>0){ctx.fillStyle=`rgba(255,255,255,${flash*2})`;ctx.fillRect(0,0,W,H)}if(paused){ctx.fillStyle="#07101dbb";ctx.fillRect(0,0,W,H);ctx.fillStyle="#fff";ctx.textAlign="center";ctx.font="900 36px -apple-system,sans-serif";ctx.fillText("PAUSE",W/2,H/2)}}function loop(now){const dt=Math.min(.033,(now-last)/1000||0);last=now;update(dt);render();requestAnimationFrame(loop)}requestAnimationFrame(loop);function bind(el,key){const down=e=>{e.preventDefault();input[key]=true;if(key==="jump")input.jumpPressed=true;el.setPointerCapture?.(e.pointerId)},up=e=>{e.preventDefault();input[key]=false};el.addEventListener("pointerdown",down,{passive:false});el.addEventListener("pointerup",up,{passive:false});el.addEventListener("pointercancel",up,{passive:false});el.addEventListener("pointerleave",up,{passive:false})}bind(leftBtn,"left");bind(rightBtn,"right");bind(jumpBtn,"jump");addEventListener("keydown",e=>{if(["ArrowLeft","KeyA"].includes(e.code))input.left=true;if(["ArrowRight","KeyD"].includes(e.code))input.right=true;if(["Space","ArrowUp","KeyW"].includes(e.code)){if(!input.jump)input.jumpPressed=true;input.jump=true}if(e.code==="Escape"&&state==="playing")toggle();if(["ArrowLeft","ArrowRight","ArrowUp","Space"].includes(e.code))e.preventDefault()},{passive:false});addEventListener("keyup",e=>{if(["ArrowLeft","KeyA"].includes(e.code))input.left=false;if(["ArrowRight","KeyD"].includes(e.code))input.right=false;if(["Space","ArrowUp","KeyW"].includes(e.code))input.jump=false});function toggle(){paused=!paused;pauseBtn.textContent=paused?"▶":"Ⅱ"}pauseBtn.onpointerdown=e=>{e.preventDefault();if(state==="playing")toggle()};startBtn.onpointerdown=e=>{e.preventDefault();audio.start();score=0;stars=0;overlay.classList.add("hidden");loadStage(0)};document.addEventListener("visibilitychange",()=>{if(document.hidden&&state==="playing"){paused=true;pauseBtn.textContent="▶"}})})();
