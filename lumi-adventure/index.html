<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>LUMI ADVENTURE</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111e;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none}#game{display:block;width:100vw;height:100dvh;background:#65c8ff}#hud{position:fixed;z-index:3;top:max(8px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;color:#fff;font-weight:900;text-shadow:0 2px 4px #17365c;pointer-events:none}#hud div{background:#08264699;border:1px solid #ffffff55;border-radius:12px;padding:7px 10px;backdrop-filter:blur(4px)}#bossbar{display:none;position:fixed;z-index:3;top:max(54px,calc(env(safe-area-inset-top) + 50px));left:12%;right:12%;height:18px;border:2px solid #fff;border-radius:10px;background:#3b1520;overflow:hidden;box-shadow:0 2px 8px #0007}#bossfill{height:100%;width:100%;background:linear-gradient(90deg,#ffce45,#ff4b4b)}#controls{position:fixed;z-index:4;inset:auto 0 0 0;height:180px;pointer-events:none}.ctrl{position:absolute;display:grid;place-items:center;border:2px solid #ffffff88;background:#09243bb8;color:#fff;font-weight:900;user-select:none;-webkit-user-select:none;pointer-events:auto;box-shadow:0 4px 12px #0005;backdrop-filter:blur(4px)}.round{width:76px;height:76px;border-radius:50%;bottom:max(18px,env(safe-area-inset-bottom))}#left{left:18px}#right{left:104px}#jump{right:18px;width:92px;height:92px;background:#9a3ec8c7}#dash{right:122px;width:62px;height:62px;bottom:calc(max(18px,env(safe-area-inset-bottom)) + 8px);background:#d26a22c7;font-size:12px}#pause{position:fixed;z-index:5;right:12px;top:max(55px,calc(env(safe-area-inset-top) + 48px));width:42px;height:42px;border-radius:12px;border:1px solid #fff8;background:#09243ba8;color:white;font-weight:900}#overlay{position:fixed;z-index:10;inset:0;display:grid;place-items:center;background:linear-gradient(#06152ac7,#06152af0);color:#fff;text-align:center;padding:24px}.panel{max-width:460px;width:min(92vw,460px);padding:24px 20px;border:2px solid #9ee8ff;border-radius:22px;background:#09213be8;box-shadow:0 0 40px #46d5ff55}h1{margin:0 0 8px;font-size:clamp(30px,9vw,52px);letter-spacing:.04em}.panel p{line-height:1.6;margin:10px 0 16px}.mainbtn{border:0;border-radius:999px;padding:13px 28px;background:#73e0ff;color:#052238;font-size:18px;font-weight:900}.small{font-size:13px;opacity:.88}@media(pointer:fine){#controls{opacity:.55}}@media(orientation:portrait){#rotate{display:block}}@media(orientation:landscape){#rotate{display:none}}
</style>
</head>
<body>
<canvas id="game"></canvas><div id="hud"><div id="stats">★ 0　◇ 0</div><div id="stage">FOREST 1</div></div><div id="bossbar"><div id="bossfill"></div></div><button id="pause">Ⅱ</button><div id="controls"><div id="left" class="ctrl round">◀</div><div id="right" class="ctrl round">▶</div><div id="dash" class="ctrl round">DASH</div><div id="jump" class="ctrl round">JUMP</div></div><div id="overlay"><div class="panel"><h1>LUMI ADVENTURE</h1><p>星の森を奪った岩王を追え。<br>走る・跳ぶ・踏みつける、オリジナル横スクロールアクション。</p><p class="small">画面左：移動　右：ジャンプ／ダッシュ<br>音が出ます。横画面推奨。</p><button id="start" class="mainbtn">GAME START</button><p id="rotate" class="small">iPhoneを横向きにすると遊びやすくなります。</p></div></div>
<script>
(()=>{'use strict';const c=document.getElementById('game'),x=c.getContext('2d'),stats=document.getElementById('stats'),stageEl=document.getElementById('stage'),overlay=document.getElementById('overlay'),startBtn=document.getElementById('start'),bossbar=document.getElementById('bossbar'),bossfill=document.getElementById('bossfill'),pauseBtn=document.getElementById('pause');let W=0,H=0,D=1,last=0,run=false,paused=false,cam=0,worldW=7200,groundY=0,time=0,score=0,gems=0,lives=3,checkpoint=120,shake=0,won=false,solids=[],coins=[],enemies=[],particles=[],shots=[],springs=[],checkpoints=[],decor=[],audio=null,musicTimer=0,musicStep=0;const key={left:false,right:false,jump:false,dash:false},p={x:120,y:0,w:32,h:42,vx:0,vy:0,on:false,face:1,coyote:0,jumpBuf:0,inv:0,shield:0,dash:0,anim:0};function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;c.style.width=W+'px';c.style.height=H+'px';x.setTransform(D,0,0,D,0,0);groundY=Math.max(310,H-105)}addEventListener('resize',resize);resize();function A(){if(audio)return;audio=new(window.AudioContext||window.webkitAudioContext)}function tone(f,d=.08,type='square',v=.035,slide=0){if(!audio)return;const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(f,audio.currentTime);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),audio.currentTime+d);g.gain.setValueAtTime(v,audio.currentTime);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+d);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+d)}const sfx={jump:()=>tone(420,.13,'square',.035,260),coin:()=>{tone(880,.07,'sine',.04,300);setTimeout(()=>tone(1320,.06,'sine',.03),55)},stomp:()=>tone(115,.12,'square',.05,-50),hurt:()=>tone(190,.25,'sawtooth',.06,-120),spring:()=>tone(260,.22,'square',.04,650),checkpoint:()=>[523,659,784,1047].forEach((n,i)=>setTimeout(()=>tone(n,.11,'triangle',.035),i*85)),boss:()=>tone(70,.35,'sawtooth',.07,-25),win:()=>[523,659,784,1047,1319].forEach((n,i)=>setTimeout(()=>tone(n,.16,'triangle',.045),i*120))},melody=[262,330,392,523,392,330,294,370,440,587,440,370,330,392,494,659,494,392];function music(){if(!run||paused||!audio)return;const f=melody[musicStep++%melody.length];tone(f,.12,'triangle',.018);if(musicStep%2===0)tone(f/2,.17,'sine',.012);musicTimer=setTimeout(music,180)}function stopMusic(){clearTimeout(musicTimer)}function rect(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}function addPlatform(px,py,pw,ph=28,type='grass'){solids.push({x:px,y:py,w:pw,h:ph,type})}function coinLine(px,py,n,sp=42){for(let i=0;i<n;i++)coins.push({x:px+i*sp,y:py,w:18,h:18,t:i*.4,taken:false})}function enemy(px,py,type='slime'){enemies.push({x:px,y:py,w:type==='boss'?92:36,h:type==='boss'?92:32,vx:type==='fly'?-80:-55,vy:0,type,hp:type==='boss'?8:1,dead:false,on:false,t:Math.random()*6,home:px})}function build(){solids=[];coins=[];enemies=[];particles=[];shots=[];springs=[];checkpoints=[];decor=[];addPlatform(-200,groundY,1050,200);addPlatform(930,groundY,650,200);addPlatform(1660,groundY,540,200);addPlatform(2280,groundY,820,200);addPlatform(3200,groundY,420,200);addPlatform(3700,groundY,650,200);addPlatform(4460,groundY,840,200);addPlatform(5410,groundY,720,200);addPlatform(6240,groundY,1200,200,'stone');[[420,groundY-120,180],[690,groundY-210,150],[1060,groundY-130,180],[1350,groundY-230,160],[1730,groundY-150,150],[1950,groundY-250,170],[2390,groundY-125,170],[2700,groundY-215,170],[2990,groundY-310,130],[3300,groundY-150,160],[3810,groundY-170,170],[4120,groundY-270,150],[4560,groundY-145,170],[4890,groundY-240,160],[5180,groundY-330,130],[5520,groundY-150,180],[5840,groundY-250,170],[6350,groundY-145,180],[6680,groundY-230,170]].forEach(v=>addPlatform(v[0],v[1],v[2],24,v[0]>6200?'stone':'grass'));coinLine(220,groundY-70,7);coinLine(445,groundY-165,4);coinLine(700,groundY-255,3);coinLine(1030,groundY-70,8);coinLine(1365,groundY-275,3);coinLine(1710,groundY-70,6);coinLine(2395,groundY-170,4);coinLine(2710,groundY-260,4);coinLine(2985,groundY-355,3);coinLine(3260,groundY-70,5);coinLine(3815,groundY-215,4);coinLine(4120,groundY-315,3);coinLine(4510,groundY-70,7);coinLine(4895,groundY-285,4);coinLine(5175,groundY-375,3);coinLine(5500,groundY-70,7);coinLine(5840,groundY-295,4);coinLine(6350,groundY-190,4);[[560,groundY-32],[1120,groundY-32],[1450,groundY-262,'fly'],[1780,groundY-32],[2050,groundY-282,'fly'],[2490,groundY-32],[2820,groundY-32],[3370,groundY-32],[3920,groundY-32],[4200,groundY-302,'fly'],[4620,groundY-32],[5030,groundY-32],[5220,groundY-362,'fly'],[5580,groundY-32],[5930,groundY-282,'fly'],[6440,groundY-32],[6800,groundY-32]].forEach(v=>enemy(v[0],v[1],v[2]||'slime'));springs.push({x:1510,y:groundY-24,w:42,h:24},{x:3060,y:groundY-24,w:42,h:24},{x:6110,y:groundY-24,w:42,h:24});checkpoints.push({x:2250,y:groundY-90,w:24,h:90,on:false},{x:5350,y:groundY-90,w:24,h:90,on:false});enemy(6940,groundY-92,'boss');for(let i=0;i<70;i++)decor.push({x:i*110+Math.random()*80,y:groundY-30-Math.random()*250,s:Math.random()*2+1,k:i%3})}function reset(full=true){if(full){score=0;gems=0;lives=3;checkpoint=120;won=false}build();Object.assign(p,{x:checkpoint,y:groundY-80,vx:0,vy:0,on:false,inv:1.5,shield:0,dash:0});cam=Math.max(0,p.x-W*.3);bossbar.style.display='none';hud()}function hud(){stats.textContent='★ '+score+'　◇ '+gems+'　♥ '+lives}function burst(px,py,col='#ffd34e',n=12){for(let i=0;i<n;i++)particles.push({x:px,y:py,vx:(Math.random()-.5)*260,vy:(Math.random()-.7)*240,l:.3+Math.random()*.5,r:2+Math.random()*5,c:col})}function die(){lives--;hud();sfx.hurt();shake=12;if(lives<=0){run=false;stopMusic();show('GAME OVER','集めた星 '+score,'RETRY',()=>{A();reset(true);run=true;overlay.style.display='none';music()});return}setTimeout(()=>{Object.assign(p,{x:checkpoint,y:groundY-90,vx:0,vy:0,inv:2});cam=Math.max(0,p.x-W*.3)},250)}function show(title,sub,button,fn){overlay.innerHTML=`<div class="panel"><h1>${title}</h1><p>${sub}</p><button id="again" class="mainbtn">${button}</button></div>`;overlay.style.display='grid';document.getElementById('again').onclick=fn}function jump(){p.jumpBuf=.14}function bind(id,prop){const el=document.getElementById(id),down=e=>{e.preventDefault();key[prop]=true;if(prop==='jump')jump()},up=e=>{e.preventDefault();key[prop]=false};el.addEventListener('pointerdown',down);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);el.addEventListener('pointerleave',up)}bind('left','left');bind('right','right');bind('jump','jump');bind('dash','dash');addEventListener('keydown',e=>{if(e.code==='ArrowLeft'||e.code==='KeyA')key.left=true;if(e.code==='ArrowRight'||e.code==='KeyD')key.right=true;if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyZ'){key.jump=true;jump()}if(e.code==='ShiftLeft'||e.code==='KeyX')key.dash=true});addEventListener('keyup',e=>{if(e.code==='ArrowLeft'||e.code==='KeyA')key.left=false;if(e.code==='ArrowRight'||e.code==='KeyD')key.right=false;if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyZ')key.jump=false;if(e.code==='ShiftLeft'||e.code==='KeyX')key.dash=false});pauseBtn.onclick=()=>{if(!run)return;paused=!paused;pauseBtn.textContent=paused?'▶':'Ⅱ';if(paused)stopMusic();else{last=performance.now();music()}};function moveBody(o,dt){o.x+=o.vx*dt;for(const s of solids)if(rect(o,s)){if(o.vx>0)o.x=s.x-o.w;else if(o.vx<0)o.x=s.x+s.w;o.vx=0}o.y+=o.vy*dt;o.on=false;for(const s of solids)if(rect(o,s)){if(o.vy>0){o.y=s.y-o.h;o.vy=0;o.on=true}else if(o.vy<0){o.y=s.y+s.h;o.vy=0}}}function update(dt){if(!run||paused)return;time+=dt;p.inv-=dt;p.jumpBuf-=dt;p.coyote=p.on?.11:p.coyote-dt;const accel=p.on?1600:850,max=key.dash?330:235;let dir=(key.right?1:0)-(key.left?1:0);if(dir){p.vx+=dir*accel*dt;p.face=dir}else p.vx*=p.on?Math.pow(.0006,dt):Math.pow(.08,dt);p.vx=Math.max(-max,Math.min(max,p.vx));if(key.dash&&dir&&p.dash<=0){p.dash=.35;tone(180,.08,'square',.025,180)}p.dash-=dt;if(p.jumpBuf>0&&p.coyote>0){p.vy=-520;p.on=false;p.coyote=0;p.jumpBuf=0;sfx.jump()}if(!key.jump&&p.vy<-180)p.vy+=1250*dt;p.vy+=1450*dt;p.vy=Math.min(850,p.vy);moveBody(p,dt);if(p.y>H+250)die();for(const sp of springs)if(rect(p,sp)&&p.vy>=0){p.y=sp.y-p.h;p.vy=-760;sfx.spring();burst(sp.x+20,sp.y,'#e45cff',14)}for(const q of coins)if(!q.taken&&rect(p,q)){q.taken=true;score++;gems++;sfx.coin();burst(q.x+9,q.y+9,'#fff06a',8);hud()}for(const cp of checkpoints)if(!cp.on&&p.x>cp.x){cp.on=true;checkpoint=cp.x+35;sfx.checkpoint();burst(cp.x,cp.y,'#66f4ff',25)}for(const e of enemies){if(e.dead)continue;e.t+=dt;if(e.type==='fly'){e.x=e.home+Math.sin(e.t*1.4)*95;e.y+=Math.sin(e.t*3)*28*dt}else if(e.type==='boss'){bossbar.style.display=p.x>6200?'block':'none';if(p.x>6200){e.vx+=(p.x<e.x?-1:1)*70*dt;e.vx=Math.max(-115,Math.min(115,e.vx));if(Math.random()<dt*.7)shots.push({x:e.x+e.w/2,y:e.y+30,vx:(p.x-e.x)*.7,vy:-220,w:18,h:18})}e.vy+=1200*dt;moveBody(e,dt);bossfill.style.width=e.hp/8*100+'%'}else{e.vy+=1200*dt;moveBody(e,dt);if(e.on&&Math.random()<dt*.5)e.vx*=-1}if(rect(p,e)&&p.inv<=0){if(p.vy>120&&p.y+p.h-12<e.y+18){p.vy=-390;e.hp--;sfx.stomp();burst(e.x+e.w/2,e.y,'#8df57b',12);if(e.hp<=0){e.dead=true;score+=e.type==='boss'?20:2;hud();if(e.type==='boss'){won=true;run=false;stopMusic();sfx.win();setTimeout(()=>show('STAGE CLEAR!','岩王を倒しました。獲得した星 '+score,'もう一度遊ぶ',()=>{reset(true);run=true;overlay.style.display='none';music()}),800)}}}else{p.inv=1.8;p.vx=(p.x<e.x?-1:1)*280;p.vy=-320;sfx.hurt();shake=10}}}for(const b of shots){b.vy+=550*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;if(rect(p,b)&&p.inv<=0){b.dead=true;p.inv=1.8;p.vx=(p.x<b.x?-1:1)*260;p.vy=-300;sfx.hurt();shake=9}}shots=shots.filter(b=>!b.dead&&b.y<H+200);particles.forEach(v=>{v.x+=v.vx*dt;v.y+=v.vy*dt;v.vy+=600*dt;v.l-=dt});particles=particles.filter(v=>v.l>0);cam+=(Math.max(0,Math.min(worldW-W,p.x-W*.38))-cam)*Math.min(1,dt*5);if(p.x>6100)stageEl.textContent='STONE KEEP';else if(p.x>3200)stageEl.textContent='MOON VALLEY';else stageEl.textContent='STAR FOREST'}function rr(px,py,w,h,r,fill){x.fillStyle=fill;x.beginPath();x.roundRect(px,py,w,h,r);x.fill()}function drawBg(){const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#4cbcf3');g.addColorStop(1,'#d8f6ff');x.fillStyle=g;x.fillRect(0,0,W,H);x.fillStyle='#fff9';for(let i=0;i<8;i++){let cx=((i*260-cam*.12)%2300+2300)%2300-150,cy=60+i%3*60;x.beginPath();x.arc(cx,cy,35,0,7);x.arc(cx+40,cy+8,48,0,7);x.arc(cx+85,cy,30,0,7);x.fill()}x.fillStyle='#80b879';x.beginPath();x.moveTo(0,groundY);for(let i=0;i<=W+100;i+=100)x.lineTo(i,groundY-140-Math.sin((i+cam*.25)*.006)*65);x.lineTo(W,groundY);x.fill();x.fillStyle='#4f8e65';x.beginPath();x.moveTo(0,groundY);for(let i=0;i<=W+90;i+=90)x.lineTo(i,groundY-80-Math.sin((i+cam*.55)*.01)*40);x.lineTo(W,groundY);x.fill()}function draw(){x.save();if(shake>0){x.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.86}drawBg();x.translate(-cam,0);for(const d of decor){if(d.x<cam-80||d.x>cam+W+80)continue;x.fillStyle=d.k===0?'#2e7c4c':d.k===1?'#286842':'#3d9252';x.fillRect(d.x,d.y,8*d.s,groundY-d.y);x.beginPath();x.arc(d.x+4*d.s,d.y,15*d.s,0,7);x.fill()}for(const s of solids){x.fillStyle=s.type==='stone'?'#596474':'#5a873e';x.fillRect(s.x,s.y,s.w,s.h);x.fillStyle=s.type==='stone'?'#8793a4':'#8dcc54';x.fillRect(s.x,s.y,s.w,9);x.strokeStyle='#0002';for(let i=0;i<s.w;i+=32)x.strokeRect(s.x+i,s.y+9,32,s.h-9)}for(const sp of springs){rr(sp.x,sp.y,sp.w,sp.h,8,'#b753d5');x.fillStyle='#fff';x.fillRect(sp.x+8,sp.y+5,26,5)}for(const cp of checkpoints){x.fillStyle='#6a4632';x.fillRect(cp.x,cp.y,5,90);x.fillStyle=cp.on?'#66f4ff':'#f7df65';x.beginPath();x.moveTo(cp.x+5,cp.y);x.lineTo(cp.x+42,cp.y+15);x.lineTo(cp.x+5,cp.y+30);x.fill()}for(const q of coins)if(!q.taken){let sy=Math.sin(time*6+q.t)*3;x.fillStyle='#ffe15b';x.beginPath();x.arc(q.x+9,q.y+9+sy,9,0,7);x.fill();x.fillStyle='#fff2';x.fillRect(q.x+7,q.y+3+sy,4,12)}for(const e of enemies){if(e.dead)continue;if(e.type==='slime'){rr(e.x,e.y,e.w,e.h,14,'#66c957');x.fillStyle='#173b25';x.fillRect(e.x+8,e.y+10,5,6);x.fillRect(e.x+23,e.y+10,5,6)}else if(e.type==='fly'){x.fillStyle='#f08cdb';x.beginPath();x.ellipse(e.x+18,e.y+16,18,13,0,0,7);x.fill();x.fillStyle='#fff';x.beginPath();x.ellipse(e.x+2,e.y+9,13,7,-.4,0,7);x.ellipse(e.x+34,e.y+9,13,7,.4,0,7);x.fill()}else{rr(e.x,e.y,e.w,e.h,18,'#686f7c');x.fillStyle='#444a55';x.fillRect(e.x+8,e.y+18,e.w-16,22);x.fillStyle='#ffcb45';x.fillRect(e.x+20,e.y+35,14,10);x.fillRect(e.x+58,e.y+35,14,10)}}x.fillStyle='#ff654f';for(const b of shots){x.beginPath();x.arc(b.x,b.y,10,0,7);x.fill()}for(const v of particles){x.globalAlpha=Math.max(0,v.l*2);x.fillStyle=v.c;x.fillRect(v.x,v.y,v.r,v.r)}x.globalAlpha=1;if(!(p.inv>0&&Math.floor(p.inv*12)%2===0)){x.save();x.translate(p.x+p.w/2,p.y+p.h/2);if(p.face<0)x.scale(-1,1);x.fillStyle='#245fa8';x.beginPath();x.ellipse(0,5,15,19,0,0,7);x.fill();x.fillStyle='#dcecff';x.beginPath();x.arc(0,-10,14,0,7);x.fill();x.fillStyle='#295ea0';x.beginPath();x.moveTo(-12,-18);x.lineTo(-7,-32);x.lineTo(-2,-20);x.moveTo(5,-21);x.lineTo(12,-32);x.lineTo(13,-16);x.fill();x.fillStyle='#182b44';x.fillRect(4,-13,4,5);x.fillStyle='#f4ad66';x.fillRect(12,-6,7,5);x.strokeStyle='#153e76';x.lineWidth=5;x.beginPath();x.moveTo(-9,20);x.lineTo(-12,27);x.moveTo(9,20);x.lineTo(13,27);x.stroke();x.restore()}x.restore();if(paused){x.fillStyle='#07182bbd';x.fillRect(0,0,W,H);x.fillStyle='#fff';x.textAlign='center';x.font='900 38px system-ui';x.fillText('PAUSE',W/2,H/2)}}function loop(n){let dt=Math.min(.033,(n-last)/1000||0);last=n;update(dt);draw();requestAnimationFrame(loop)}startBtn.onclick=()=>{A();audio.resume();reset(true);overlay.style.display='none';run=true;paused=false;last=performance.now();stopMusic();music()};reset(true);requestAnimationFrame(loop)})();
